[package]
name = "oryxis-vault"
version = "0.1.0"
edition = "2024"

[dependencies]
oryxis-core = { workspace = true }
rusqlite = { workspace = true }
argon2 = { workspace = true }
chacha20poly1305 = { workspace = true }
# OS entropy for salts and nonces. aead 0.6 dropped its `OsRng`
# re-export, which was a four-line wrapper whose `try_fill_bytes` called
# `getrandom` and nothing else; this is the same syscall without the
# alias. Deliberately not `rand`: routing through aead existed to avoid
# pinning a `rand` version here, and that reason still holds.
getrandom = "0.4"
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
zeroize = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
# Session-log chunk compression (deflate). Already present transitively
# in the workspace tree, so this adds no new build weight.
flate2 = "1"
# Pinned to the same `rand` generation russh 0.62 already pulls in (its
# `ThreadRng` implements `rand_core 0.10`'s `CryptoRng`, which
# `ssh_key::PrivateKey::random` requires). Only `keygen` uses it; the
# at-rest crypto in `store/` drives `aead::OsRng` through the
# `rand_core` re-exported by `chacha20poly1305`, so it stays decoupled
# from this version.
rand = "0.10"
base64 = "0.23"
# ssh-key 0.7 is the version russh 0.62 consumes; pinning the vault to it
# collapses the duplicate 0.6 copy (and its rsa 0.9 / p256 0.13 tails)
# down to a single crypto stack across the workspace. russh pins the exact
# release candidate, so this pin moves in lockstep with a russh bump.
ssh-key = { version = "=0.7.0-rc.11", features = ["ed25519", "std", "rand_core", "encryption", "rsa", "p256", "p384", "p521"] }
rsa = "0.10.0-rc.18"
p256 = { version = "0.14", features = ["ecdsa", "pkcs8", "pem"] }
p384 = { version = "0.14", features = ["ecdsa", "pkcs8", "pem"] }
p521 = { version = "0.14", features = ["ecdsa", "pkcs8", "pem"] }
# Encrypted PKCS#8 (`BEGIN ENCRYPTED PRIVATE KEY`) support. We decrypt
# once with pkcs8's PBES2 implementation, then hand the inner plaintext
# back to the per-algorithm PKCS#8 parsers above.
pkcs8 = { version = "0.11", features = ["encryption", "pem"] }
# PPK (PuTTY .ppk) parser primitives plus OpenSSL-legacy traditional PEM
# decryption (EVP_BytesToKey/MD5 + AES-CBC or DES-EDE3-CBC). All
# transitively present already via russh / ssh-key; declared here to give
# the keygen module stable direct paths.
aes = "0.9"
cbc = "0.2"
des = "0.9"
md-5 = "0.11"
hmac = "0.13"
sha1 = "0.11"
sha2 = "0.11"
subtle = "2"

[dev-dependencies]
tempfile = "3"
